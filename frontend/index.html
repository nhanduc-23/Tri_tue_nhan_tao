<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b52">
  <title>Smart Waste Sorter</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18312a; background: #f3f7f4; }
    body { max-width: 960px; margin: auto; padding: 1rem; }
    h1 { color: #176b52; }
    .camera { position: relative; width: 100%; background: #14231e; border-radius: 12px; overflow: hidden; }
    video, canvas { display: block; width: 100%; height: auto; }
    canvas { position: absolute; inset: 0; }
    button { border: 0; border-radius: 8px; padding: .7rem 1rem; margin: .75rem .4rem .75rem 0; background: #176b52; color: white; font-size: 1rem; }
    button:disabled { opacity: .55; }
    #status { min-height: 1.5em; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { text-align: left; border-bottom: 1px solid #dce7e0; padding: .65rem; }
    .hint { color: #53665e; }
  </style>
</head>
<body>
  <h1>Smart Waste Sorter</h1>
  <p class="hint">Bản thử nghiệm dùng nhận diện mô phỏng. Hướng dẫn phân loại có thể khác theo quy định và điểm thu gom địa phương.</p>
  <div class="camera"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
  <button id="start">Bật camera</button>
  <button id="stop" disabled>Dừng camera</button>
  <p id="status" role="status">Sẵn sàng.</p>
  <h2>Thống kê phát hiện</h2>
  <table><thead><tr><th>Loại rác</th><th>Số lần</th></tr></thead><tbody id="stats"><tr><td colspan="2">Chưa có dữ liệu</td></tr></tbody></table>
  <h2>Hướng dẫn</h2>
  <ul id="instructions"><li>Chưa có vật thể được phát hiện.</li></ul>
  <script src="app.js"></script>
</body>
</html>
